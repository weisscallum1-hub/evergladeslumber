<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>ELX Lead Inbox</title>
<link rel="icon" href="/assets/elx-mark.svg" type="image/svg+xml">
<style>
:root{--green:#153d2e;--ink:#202622;--muted:#68716d;--paper:#f8f7f2;--line:#dde2dd;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}header{background:var(--green);color:white;padding:22px max(20px,calc((100% - 1160px)/2))}header a{color:white;text-decoration:none;font-weight:800;letter-spacing:.04em}main{width:min(1160px,94vw);margin:34px auto 80px}h1{color:var(--green);font-size:clamp(1.8rem,4vw,2.7rem);margin:0 0 4px}.muted,.note{color:var(--muted)}.gate,.lead{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}.gate{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:10px;align-items:center}.gate input,.controls select,.lead select,.lead textarea{border:1px solid #cdd6d0;border-radius:9px;padding:10px;font:inherit;background:white}.btn{border:0;border-radius:999px;background:var(--green);color:white;padding:11px 17px;font:700 .9rem Inter,system-ui;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}.lead-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.badge{padding:4px 10px;background:#eef3ef;border-radius:999px;font-size:.78rem;font-weight:800;color:var(--green)}.meta{font-size:.82rem;color:var(--muted)}.lead-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}.lead h2{font-size:1.08rem;color:var(--green);margin:0 0 6px}.lead p{margin:4px 0;overflow-wrap:anywhere}.lead pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:.9rem;margin:6px 0}.lead textarea{width:100%;min-height:72px;resize:vertical;margin:8px 0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.statusline{min-height:1.6em;color:var(--muted)}a{color:var(--green)}.quote-grid{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:9px;margin-top:12px}.quote-grid label{font-size:.8rem;color:var(--muted)}.quote-grid input,.quote-grid textarea{width:100%;display:block;border:1px solid #cdd6d0;border-radius:8px;padding:8px;font:inherit}.quote-grid .wide{grid-column:1/-1}.quote-card{border-top:1px solid var(--line);padding:12px 0}.history{margin-top:14px;font-size:.82rem;color:var(--muted)}@media(max-width:700px){.gate{grid-template-columns:1fr}.lead-grid{grid-template-columns:1fr}.quote-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><a href="/">EVERGLADES LUMBER EXCHANGE <span style="font-weight:500;opacity:.78">/ private lead inbox</span></a></header>
<main>
  <h1>Lead inbox</h1>
  <p class="muted">Private operations view. Supplier matches, listings, and commercial decisions still require a person to verify them.</p>
  <section class="gate" aria-label="Admin access">
    <input id="adminKey" type="password" autocomplete="off" placeholder="ELX admin key" aria-label="ELX admin key">
    <button class="btn" id="connect">Open inbox</button>
    <button class="btn" id="disconnect" type="button" style="background:#59645e">Clear key</button>
  </section>
  <p id="statusline" class="statusline" role="status" aria-live="polite"></p>
  <section class="controls" aria-label="Lead filters">
    <label for="filter">Filter</label>
    <select id="filter"><option value="">All requests</option><option>new</option><option>reviewing</option><option>waiting_buyer</option><option>supplier_outreach</option><option>quoted</option><option>closed</option><option>spam</option><option>published</option><option>paused</option></select>
    <button class="btn" id="refresh" type="button">Refresh</button>
    <span id="count" class="meta"></span>
  </section>
  <section id="leads" aria-live="polite"></section>
</main>
<script>
const keyInput=document.querySelector('#adminKey');
const statusline=document.querySelector('#statusline');
const leadsEl=document.querySelector('#leads');
const filter=document.querySelector('#filter');
const statusValues=['new','reviewing','waiting_buyer','supplier_outreach','quoted','closed','spam','published','paused'];
let adminKey='';
function node(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=String(text);if(className)el.className=className;return el;}
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'content-type':'application/json','x-elx-admin-key':adminKey,...options.headers}});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||`Request failed (${response.status})`);return body;}
function money(cents){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(cents)||0)/100);}
function renderLead(lead){
  const article=node('article',undefined,'lead');
  const top=node('div',undefined,'lead-head');const titleWrap=node('div');titleWrap.append(node('span',lead.kind.toUpperCase(),'badge'),node('h2',lead.data.company||lead.data.project_type||'Buyer quote request'));
  titleWrap.append(node('div',`${lead.id} · ${new Date(lead.created_at).toLocaleString()}`,'meta'));
  const state=node('span',lead.status,'badge');top.append(titleWrap,state);article.append(top);
  const grid=node('div',undefined,'lead-grid');const detail=node('section');detail.append(node('h2','Submitted details'));
  const data=lead.data||{};
  for(const [label,value] of Object.entries(data)){if(!value)continue;const row=node('p');row.append(node('strong',`${label.replaceAll('_',' ')}: `),document.createTextNode(String(value)));detail.append(row);}
  const review=node('section');review.append(node('h2','AI first-pass review · verify manually'));
  review.append(node('p',lead.ai_review?.summary||'No review summary available.'));
  review.append(node('p',`Categories: ${(lead.ai_review?.categories||[]).join(', ')||'None detected'}`));
  review.append(node('p',`Details to clarify: ${(lead.ai_review?.missing_details||[]).join(', ')||'No automatic flags'}`));
  review.append(node('p',lead.ai_review?.automation_limit||'Human verification required.','meta'));
  review.append(node('p',`Email notification: ${lead.notification_status||'pending'}`,'meta'));
  grid.append(detail,review);article.append(grid);
  if(lead.kind==='buyer'){
    const quoteSection=node('section');quoteSection.append(node('h2','Supplier quote comparison · manual supplier-confirmed entries'));
    if(lead.quotes?.length){for(const quote of lead.quotes){const card=node('div',undefined,'quote-card');card.append(node('strong',`${quote.supplier_name} · ${money(quote.total_cents)} total`));card.append(node('p',`${quote.quantity} ${quote.unit} × ${money(quote.unit_price_cents)} · freight ${money(quote.freight_cents)} · tax ${money(quote.tax_cents)} · other ${money(quote.other_fees_cents)}`));card.append(node('p',`${quote.product_spec} · FOB ${quote.fob_point||'not provided'} · stock ${quote.stock_status||'not stated'} · delivery ${quote.delivery_timing||'not stated'}`));card.append(node('p',`Terms: ${quote.payment_terms||'not stated'} · valid until ${quote.valid_until||'not stated'} · reference ${quote.quote_reference||'none'}`,'meta'));if(quote.notes)card.append(node('p',quote.notes));quoteSection.append(card);}}
    else quoteSection.append(node('p','No supplier quotes recorded yet. Ask the supplier to confirm the exact spec, quantity, stock, freight, taxes and terms.','meta'));
    const form=document.createElement('form');form.className='quote-grid';
    const fields=[['supplier_name','Supplier name','text',true],['quote_reference','Supplier quote ref','text',false],['product_spec','Exact quoted product/spec','text',true],['quantity','Quantity','number',true],['unit','Unit (sheets, pieces, etc.)','text',true],['unit_price','Unit price USD','number',true],['freight','Freight USD','number',false],['tax','Tax USD','number',false],['other_fees','Other fees USD','number',false],['fob_point','Named FOB point','text',false],['stock_status','Stock / lead status','text',false],['delivery_timing','Delivery timing','text',false],['valid_until','Quote valid until','date',false],['payment_terms','Supplier-approved payment terms','text',false]];
    for(const [name,label,type,required] of fields){const wrap=node('label',label);const input=document.createElement('input');input.name=name;input.type=type;input.required=required;if(type==='number'){input.min='0';input.step='0.01';}if(['freight','tax','other_fees'].includes(name))input.value='0';wrap.append(input);form.append(wrap);}
    const notesWrap=node('label','Quote exclusions, delivery/unloading details, or substitutions');notesWrap.className='wide';const notes=document.createElement('textarea');notes.name='notes';notesWrap.append(notes);form.append(notesWrap);
    const saveQuote=node('button','Record supplier quote','btn');saveQuote.type='submit';form.append(saveQuote);
    form.addEventListener('submit',async(event)=>{event.preventDefault();saveQuote.disabled=true;try{await api(`/api/admin/leads/${encodeURIComponent(lead.id)}/quotes`,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form).entries()))});statusline.textContent='Supplier quote recorded.';await loadLeads();}catch(error){statusline.textContent=error.message;}finally{saveQuote.disabled=false;}});
    article.append(quoteSection,form);
  }
  if(lead.events?.length){const history=node('section',undefined,'history');history.append(node('strong','Activity history'));for(const event of lead.events)history.append(node('p',`${new Date(event.created_at).toLocaleString()} · ${event.event_type}${event.detail?.from?` · ${event.detail.from} → ${event.detail.to}`:''}${event.detail?.supplier_name?` · ${event.detail.supplier_name} · ${money(event.detail.total_cents)}`:''}`));article.append(history);}
  const controls=node('div',undefined,'actions');const status=node('select');status.setAttribute('aria-label','Lead status');
  for(const value of statusValues){const option=node('option',value);option.value=value;option.selected=value===lead.status;status.append(option);}
  const note=node('textarea');note.placeholder='Internal note or next action';note.value=lead.internal_note||'';
  let verified;
  if(lead.kind==='supplier'){
    const label=node('label');verified=document.createElement('input');verified.type='checkbox';verified.checked=lead.data?.business_verified===true;label.append(verified,document.createTextNode(' Independently verified with the business'));
    article.append(label);
  }
  const save=node('button','Save update','btn');save.type='button';save.addEventListener('click',async()=>{save.disabled=true;try{await api(`/api/admin/leads/${encodeURIComponent(lead.id)}`,{method:'PATCH',body:JSON.stringify({status:status.value,note:note.value,...(verified?{business_verified:verified.checked}:{})})});statusline.textContent='Lead updated.';await loadLeads();}catch(error){statusline.textContent=error.message;}finally{save.disabled=false;}});
  const redact=node('button','Permanently delete request','btn');redact.type='button';redact.style.background='#8b2e25';redact.addEventListener('click',async()=>{if(!window.confirm('Permanently delete this request, quote records and activity history? This cannot be undone.'))return;redact.disabled=true;try{await api(`/api/admin/leads/${encodeURIComponent(lead.id)}/redact`,{method:'DELETE'});statusline.textContent='Request and related records permanently deleted.';await loadLeads();}catch(error){statusline.textContent=error.message;}finally{redact.disabled=false;}});
  controls.append(status,save,redact);article.append(node('h2','Internal note'));article.append(note,controls);return article;
}
async function loadLeads(){
  if(!adminKey){statusline.textContent='Enter the admin key to view the inbox.';return;}
  statusline.textContent='Loading requests…';leadsEl.replaceChildren();
  try{const query=filter.value?`?status=${encodeURIComponent(filter.value)}`:'';const result=await api(`/api/admin/leads${query}`);document.querySelector('#count').textContent=`${result.leads.length} recent request${result.leads.length===1?'':'s'}`;for(const lead of result.leads)leadsEl.append(renderLead(lead));statusline.textContent=result.leads.length?'Inbox loaded.':'No requests in this view.';}
  catch(error){statusline.textContent=error.message;document.querySelector('#count').textContent='';}
}
document.querySelector('#connect').addEventListener('click',()=>{adminKey=keyInput.value.trim();loadLeads();});
document.querySelector('#refresh').addEventListener('click',loadLeads);
document.querySelector('#disconnect').addEventListener('click',()=>{adminKey='';keyInput.value='';leadsEl.replaceChildren();document.querySelector('#count').textContent='';statusline.textContent='Admin key cleared from this page.';});
filter.addEventListener('change',loadLeads);
</script>
</body>
</html>
