<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c32">
  <meta name="robots" content="noindex">
  <title>Page not found | Everglades Lumber Exchange</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #19352d; background: #f5f3ed; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 620px); padding: clamp(28px, 7vw, 64px); border: 1px solid #d9ded5; border-radius: 20px; background: #fffefa; box-shadow: 0 24px 70px rgb(25 53 45 / 8%); }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 750; letter-spacing: -.03em; }
    .brand img { width: 42px; height: 42px; }
    .eyebrow { margin: 48px 0 12px; color: #9a6828; font-size: .76rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 12ch; font-size: clamp(2.5rem, 8vw, 4rem); line-height: .99; letter-spacing: -.055em; }
    p { max-width: 44ch; margin: 20px 0 28px; color: #55645d; font-size: 1.05rem; line-height: 1.65; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; }
    nav a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 18px; border: 1px solid #173c32; border-radius: 7px; color: #173c32; font-weight: 700; text-decoration: none; }
    nav a:first-child { background: #173c32; color: white; }
    nav a:focus-visible, .brand:focus-visible { outline: 3px solid #c8893f; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">
      <img src="/assets/elx-mark.svg" alt="">
      <span>Everglades Lumber Exchange</span>
    </a>
    <p class="eyebrow">Error 404</p>
    <h1>This trail doesn’t lead anywhere.</h1>
    <p>The page may have moved or the address may be mistyped. Head back to the lumber desk or browse the supplier directory.</p>
    <nav aria-label="Helpful links">
      <a href="/">Back to the lumber desk</a>
      <a href="/directory">Browse suppliers</a>
    </nav>
  </main>
</body>
</html>
